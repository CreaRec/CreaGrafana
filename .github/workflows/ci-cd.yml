name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  DEPLOY_DIR: /home/crearec/crea-grafana

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      grafana: ${{ steps.filter.outputs.grafana }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'docker-compose.yml'
              - 'config/**'
            grafana:
              - 'docker-compose.yml'
              - 'config/grafana/**'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: ./scripts/test.sh

  otel-package:
    runs-on: ubuntu-latest
    needs: [changes, test]
    defaults:
      run:
        working-directory: packages/crea-otel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/crea-otel/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: Setup SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy compose pull/up
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
          RELOAD_GRAFANA: ${{ needs.changes.outputs.grafana }}
        run: |
          set -euo pipefail
          SSH_TARGET="${SSH_USER}@${SERVER_HOST}"
          SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)
          SCP=(scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes)

          "${SSH[@]}" "$SSH_TARGET" "mkdir -p '${DEPLOY_DIR}/data/alloy' '${DEPLOY_DIR}/data/loki' '${DEPLOY_DIR}/data/tempo' '${DEPLOY_DIR}/data/mimir' '${DEPLOY_DIR}/data/grafana' '${DEPLOY_DIR}/data/listen-ports' '${DEPLOY_DIR}/config'"
          "${SCP[@]}" docker-compose.yml "${SSH_TARGET}:${DEPLOY_DIR}/docker-compose.yml"
          "${SCP[@]}" -r config "${SSH_TARGET}:${DEPLOY_DIR}/"

          "${SSH[@]}" "$SSH_TARGET" bash -s <<EOF
          set -euo pipefail
          cd '${DEPLOY_DIR}'

          if [ ! -f .env ]; then
            echo "ERROR: ${DEPLOY_DIR}/.env is missing. Bootstrap .env on the server first (see docs/docker.md)." >&2
            exit 1
          fi

          docker network create lgtm 2>/dev/null || true
          docker compose pull
          docker compose up -d
          # export.sh is bind-mounted; content changes do not recreate the container by themselves
          docker compose up -d --force-recreate listen-ports
          # Grafana does not reload bind-mounted provisioning (alert rules,
          # dashboards) on up -d unless the container is recreated.
          if [ '${RELOAD_GRAFANA}' = 'true' ]; then
            echo "Restarting Grafana to reload provisioning"
            docker compose restart grafana

            echo "Waiting for Grafana /api/health"
            healthy=0
            for i in \$(seq 1 45); do
              port="\$(docker compose port grafana 3000 2>/dev/null || true)"
              if [ -n "\${port}" ] && curl -fsS --max-time 3 "http://\${port}/api/health" >/dev/null 2>&1; then
                echo "Grafana is healthy"
                healthy=1
                break
              fi
              sleep 2
            done
            if [ "\${healthy}" -ne 1 ]; then
              echo "ERROR: Grafana did not become healthy after restart" >&2
              docker compose ps grafana >&2
              docker compose logs --tail=80 grafana >&2
              exit 1
            fi
          fi
          docker compose ps
          docker compose logs --tail=40
          EOF
