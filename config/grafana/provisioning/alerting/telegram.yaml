apiVersion: 1

# Notification templates are not env-interpolated, so Go template `$` is safe here.
# Contact-point `settings` ARE interpolated: any `$name` becomes an env var
# (empty if unset). Escape a literal `$` as `$$` if you add one there.
#
# Message text is plain (parse_mode: None). Several rule titles contain
# `<`, `>`, and `°`; HTML/Markdown would need escaping and a parse error
# becomes a Telegram 400 and a dropped notification.
templates:
  - orgId: 1
    name: crea_telegram.message
    template: |
      {{ define "crea_telegram.value" -}}
      {{- if index .Values "B" -}}
      {{- index .Values "B" -}}{{- with .Annotations.value_unit -}}{{- . -}}{{- end -}}
      {{- else if .Annotations.value_display -}}
      {{- .Annotations.value_display -}}
      {{- else -}}н/д{{- end -}}
      {{- end }}

      {{ define "crea_telegram.where" -}}
      {{- $host := index .Labels "host" -}}
      {{- $device := or (index .Labels "device") (index .Annotations "device") -}}
      {{- if or $host $device -}}
      {{ $host }}{{ if and $host $device }} {{ end }}{{ $device }}
      {{ end -}}
      {{- end }}

      {{ define "crea_telegram.message" -}}
      {{ range .Alerts.Firing -}}
      🔥 {{ .Labels.alertname }}
      Сейчас: {{ template "crea_telegram.value" . }}
      {{ template "crea_telegram.where" . -}}
      {{ end -}}
      {{ range .Alerts.Resolved -}}
      ✅ Норма: {{ .Labels.alertname }}, сейчас {{ template "crea_telegram.value" . }}
      {{ end -}}
      {{ end }}

# bottoken is required by Grafana 11.5.2 at provision time (ValidateContactPoint
# on startup). An empty $GF_TELEGRAM_BOT_TOKEN makes Grafana refuse to start.
# Set it in the server .env before this file is deployed.
#
# File provisioning has no secure_settings field on receivers (Grafana 11.5.2);
# bottoken lives under settings and is interpolated from the environment.
# chatid must stay a YAML string. Use `|` (keep the trailing newline), not `|-`.
# Grafana 11.5.2 interpolates env vars after YAML parse and then unmarshals
# settings as JSON; a newline-stripped digit string is coerced to a number and
# startup fails with: cannot unmarshal number into Config.chatid of type string.
contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: crea-telegram
        type: telegram
        disableResolveMessage: false
        settings:
          bottoken: $GF_TELEGRAM_BOT_TOKEN
          chatid: |
            $GF_TELEGRAM_CHAT_ID
          parse_mode: None
          disable_web_page_preview: true
          message: '{{ template "crea_telegram.message" . }}'

# The policy tree is a single resource: provisioning replaces the whole tree.
# Root and media-usb child both use the Telegram contact point (the only notifier).
# Grafana's built-in default contact point is left in place unused.
policies:
  - orgId: 1
    receiver: telegram
    group_by:
      - grafana_folder
      - alertname
    routes:
      - receiver: telegram
        object_matchers:
          - ['disk', '=', 'media-usb']
        group_by:
          - grafana_folder
          - alertname
